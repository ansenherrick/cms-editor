services:
  cms-api:
    depends_on:
      framer-bridge:
        condition: service_healthy
    environment:
      CMS_PROVIDER: framer
      CMS_FRAMER_BRIDGE_URL: http://framer-bridge:8090
      CMS_FRAMER_BRIDGE_TOKEN: ${CMS_FRAMER_BRIDGE_TOKEN:?Generated by start-cms.ps1.}
      CMS_WEBSITE_ID: personal-site
    networks:
      - default
      - framer

  framer-bridge:
    build:
      context: ../../framer-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FRAMER_API_KEY: ${FRAMER_API_KEY:?Set this as a Windows user environment variable before starting.}
      FRAMER_PROJECT_URL: https://framer.com/projects/Personal-Website--Qi2it0L3x4vLRZFcsOSe
      FRAMER_COLLECTION: ${CMS_FRAMER_COLLECTION:-blog-posts}
      FRAMER_BRIDGE_TOKEN: ${CMS_FRAMER_BRIDGE_TOKEN:?Generated by start-cms.ps1.}
      CMS_WEBSITE_ID: personal-site
    expose:
      - "8090"
    networks:
      - framer

networks:
  framer:
